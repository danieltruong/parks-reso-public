    <span class="material-icons md-48 spinner rotating">
        autorenew
    </span>
</div>

<div *ngIf="!loading">
    <div *ngFor="let park of data[0].rowData" class="col-12">
        <app-card [data]="park">
        </app-card>
    </div>
</div>

<div *ngIf="totalListItems === 0 && !loading">
    <p>
        There are no parks to display.
    </p>
    <p *ngIf="!error">
        There are no day passes needed on provincial parks at this time.
    </p>
    <p *ngIf="error">
        Please contact <a href="mailto:parkinfo@Victoria1.gov.bc.ca">parkinfo&#64;Victoria1.gov.bc.ca</a> if you
        continue to
        experience issues.
    </p>
</div>
